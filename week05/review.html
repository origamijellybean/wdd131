<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="An example of a form using Javascript, CSS, and HTML.">
    <meta name="author" content="Tyson Hunter">
    <link rel="preload" href="styles/quicksand.woff2" as="font" type="font/woff2" crossorigin>
    <title>Review Submission Page</title>
    <script src="scripts/form.js" defer></script>
    <link rel="stylesheet" href="styles/form.css">
    <link rel="stylesheet" href="styles/form-large.css">
</head>
<body>
    <header>
        <h1 class="page-title">Product Review</h1>
    </header>
    <main>
        <h2 id="submission-confirmation">Submitted Successfully!</h2>
        <p>Thank you for reviewing our product!</p>
        <p id="number-of-submissions"></p>
        <form method="get" action="form.html">
            <fieldset>
                <legend>Review another product:</legend>
                <input type="submit" value="return">
            </fieldset>
        </form>
    </main>
    <footer>
        <p id="currentyear"><span></span></p>
        <p id="lastModified"></p>
    </footer>
</body>
</html>
