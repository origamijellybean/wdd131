<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tyson's Origami Store</title>
    <meta name="author" content="Tyson Hunter">
    <meta name="description" content="A website describing what origami is, what types there are, where to find supplies, and some designs.">
    <link rel="stylesheet" href="styles/tysonorigami.css">
    <link rel="stylesheet" href="styles/tysonorigami-large.css">
    <script src="scripts/tysonorigami.js" defer></script>
    <link rel="preload" href="styles/chakrapetch-italic.ttf" as="font" type="font/ttf" crossorigin="anonymous">
    <link rel="preload" href="styles/quicksand.woff2" as="font" type="font/woff2" crossorigin="anonymous">
</head>
<body>
    <header>
        <button id="menu" aria-label="menu"></button>
        <div>
            <img src="images/cardboard-origami-flower.webp" alt="giant folded cardboard flower" id="mini-img1" loading="lazy" width="50" height="50">
            <span>Tyson's Origami</span>
            <img src="images/origami-geometric-pattern.webp" alt="folded pattern out of paper" id="mini-img2" loading="lazy" width="50" height="50">
        </div>
        
        <nav>
            <ul>
                <li><a href="tysonorigami.html" title="Home" class="home">Home</a></li>
                <li><a href="info-page.html" title="info-page" class="info-page">Learn</a></li>
                <li><a href="#" title="store-page" class="store-page">Store</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <form method="get" action="review.html">
            <fieldset id="productname">
                <legend>Product Name<span class="subtext">*</span></legend>
                <!-- <label for="product">Product</label> -->
                <label for="product">Product: 
                    <select id="product" name="product" required>
                        <option disabled selected value="">Select a Product...</option>
                    </select>
                </label>
            </fieldset>
            <fieldset id="radio">
                <legend>Overall Rating<span class="subtext">*</span></legend>
                <label for="5star"><input type="radio" id="5star" name="rating" value="5" required>☆☆☆☆☆</label>
                <label for="4star"><input type="radio" id="4star" name="rating" value="4" required>☆☆☆☆</label>
                <label for="3star"><input type="radio" id="3star" name="rating" value="3" required>☆☆☆</label>
                <label for="2star"><input type="radio" id="2star" name="rating" value="2" required>☆☆</label>
                <label for="1star"><input type="radio" id="1star" name="rating" value="1" required>☆</label>
            </fieldset>
            <fieldset id="installationdate">
                <legend>Date of Installation<span class="subtext">*</span></legend>
                <!-- <label for="date">Date</label> -->
                <label for="date">Date: 
                    <input type="date" id="date" name="date" required>
                </label>
            </fieldset>
            <fieldset id="checkbox">
                <legend>Useful Features <span class="subtext">(select all that apply)</span></legend>
                <label for="value"><input type="checkbox" id="value" name="value" value="yes">Value</label>
                <label for="durability"><input type="checkbox" id="durability" name="durability" value="yes">Durability</label>
                <label for="design"><input type="checkbox" id="design" name="design" value="yes">Design</label>
                <label for="ease"><input type="checkbox" id="ease" name="ease" value="yes">Ease of Use</label>
            </fieldset>
            <fieldset>
                <legend>Written Review <span class="subtext">(optional)</span></legend>
                <!-- <label for="review">Your Review</label> -->
                <label for="review"> Review: 
                    <textarea id="review" name="review" rows="4" placeholder="I loved this product because..."></textarea>
                </label>
            </fieldset>
            <fieldset>
                <legend>Name <span class="subtext">(optional)</span></legend>
                <!-- <label for="username">Name</label> -->
                <label for="name">Name: 
                    <input type="text" id="name" name="name" placeholder="Kevin Bacon">
                </label>
            </fieldset>
            <fieldset>
                <legend>Submission</legend>
                <!-- <label for="submit">Submit</label> -->
                <label for="submit">Submit:
                    <input type="submit" id="submit" value="Submit Review">
                </label>
            </fieldset>
        </form>
    </main>
    <footer>
        <p class="citations-page"><a class="citations-page" href="citations.html" title="citations-page">Citations page</a></p>
        <p id="currentyear"><span></span></p>
        <p id="lastModified"></p>
    </footer>
</body>
</html>
